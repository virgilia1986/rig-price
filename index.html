  let currentCategory = 'ALL';

  function filterCategory(cat) {
    currentCategory = cat;
    const btns = document.querySelectorAll('.cat-btn');
    btns.forEach(btn => {
      btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'ALL' && btn.textContent === 'すべて表示'));
    });
    renderParts();
  }

  function renderParts() {
    const grid = document.getElementById('partsGrid');
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const sort = document.getElementById('sortSelect').value;

    let list = usedParts.filter(item => {
      const matchCat = (currentCategory === 'ALL' || item.category === currentCategory);
      const matchQuery = !query || item.name.toLowerCase().includes(query) || (item.recommend && item.recommend.toLowerCase().includes(query));
      return matchCat && matchQuery;
    });

    list.sort((a, b) => {
      if (sort === 'price-asc') return a.usedPriceAvg - b.usedPriceAvg;
      if (sort === 'price-desc') return b.usedPriceAvg - a.usedPriceAvg;
      return 0;
    });

    grid.innerHTML = '';

    list.forEach(item => {
      // 1. メルカリ（自動成果付与）
      const mercariUrl = `https://jp.mercari.com/search?afid=${MERCARI_AFID}&keyword=${item.mercariQuery}&status=on_sale`;
      
      // 2. Yahoo!ショッピング中古ストア検索（商品状態：中古絞り込み）
      let yahooShopUrl = `https://shopping.yahoo.co.jp/search?p=${item.yahooQuery}&used=1`;
      if (YAHOO_AFID) {
        yahooShopUrl = `https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=${YAHOO_AFID}&pid=...&vc_url=${encodeURIComponent(yahooShopUrl)}`;
      }
      
      // 3. 楽天中古・じゃんぱら等（自動成果付与）
      const rakutenSearchRaw = `https://search.rakuten.co.jp/search/mall/${item.shopQuery}+中古/?f=1`;
      const rakutenShopUrl = `https://hb.afl.rakuten.co.jp/ichiba/${RAKUTEN_AFID}/?pc=${encodeURIComponent(rakutenSearchRaw)}`;

      const card = document.createElement('div');
      card.className = 'part-card';
      card.innerHTML = `
        <div>
          <div class="card-top">
            <span class="tag">${item.category}</span>
          </div>
          <h2 class="part-name">${item.name}</h2>
          <div class="new-reference">参考: <s>${item.newPriceRef}</s></div>

          <div class="recommend-box">
            <div class="recommend-title">💡 こんな人におすすめ</div>
            <div>${item.recommend}</div>
          </div>

          <div class="used-price-box">
            <div>
              <span class="used-label">中古相場目安</span>
              <span class="used-sub">新品比 ${item.diffPercent}</span>
            </div>
            <div class="used-price">¥${item.usedPriceAvg.toLocaleString()}〜</div>
          </div>

          <div class="market-links">
            <a href="${mercariUrl}" target="_blank" class="market-btn btn-mercari">
              <span>メルカリで現在出品を見る</span>
              <span class="market-pill">即購入 (2%還元)</span>
            </a>
            <a href="${yahooShopUrl}" target="_blank" class="market-btn btn-yahoo">
              <span>Yahoo!ショッピング中古を探す</span>
              <span class="market-pill">PayPay還元</span>
            </a>
            <a href="${rakutenShopUrl}" target="_blank" class="market-btn btn-shop">
              <span>${item.shopName}（保証付き）</span>
              <span class="market-pill">楽天・店舗保証 (2〜4%還元)</span>
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }
