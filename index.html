<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RigPrice - 自作PCパーツ最安値＆BTOゲーミングPC比較</title>
  <style>
    :root {
      --bg-main: #0a0f1d;
      --bg-card: #131c31;
      --bg-sub: #1b2744;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #243456;
      --shop-amazon: #f97316;
      --shop-dospara: #2563eb;
      --shop-koubou: #dc2626;
      --shop-tsukumo: #059669;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }
    header {
      background: rgba(19, 28, 49, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .logo span { color: var(--accent); }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      background: var(--bg-sub);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 20px 60px 20px;
    }

    /* 高報酬BTOバナー枠 */
    .bto-hero {
      background: linear-gradient(135deg, #1e1b4b, #172554);
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .bto-hero-text h3 {
      margin: 0 0 6px 0;
      font-size: 1.15rem;
      color: #fff;
    }
    .bto-hero-text p {
      margin: 0;
      font-size: 0.85rem;
      color: #93c5fd;
    }
    .bto-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px 20px;
      border-radius: 8px;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .bto-btn:hover { opacity: 0.9; }

    /* カテゴリタブ & 検索 */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .category-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-btn:hover {
      border-color: var(--accent);
      color: #fff;
    }
    .cat-btn.active {
      background: var(--accent);
      color: #0a0f1d;
      border-color: var(--accent);
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 260px;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .sort-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    /* パーツグリッド */
    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 20px;
    }
    .part-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .part-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-sub);
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .trend-down {
      color: var(--success);
      font-size: 0.75rem;
      font-weight: bold;
    }
    .part-name {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0 0 6px 0;
      color: #fff;
    }
    .part-spec {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* 最安値ハイライト */
    .best-price-box {
      background: var(--bg-sub);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-left: 4px solid var(--success);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .best-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .best-store {
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      display: block;
    }
    .best-price {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--success);
      letter-spacing: -0.5px;
    }

    /* 店舗比較リスト */
    .store-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .store-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      font-size: 0.84rem;
      border: 1px solid transparent;
    }
    .store-item.is-lowest {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.05);
    }
    .store-name-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .store-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
    }
    .pill-amazon { background: var(--shop-amazon); }
    .pill-dospara { background: var(--shop-dospara); }
    .pill-koubou { background: var(--shop-koubou); }
    .pill-tsukumo { background: var(--shop-tsukumo); }
    .store-price {
      font-weight: 700;
      color: var(--text);
    }
    .store-subinfo {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* アクションボタン */
    .btn-buy {
      display: block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-buy:hover {
      opacity: 0.92;
      transform: scale(0.99);
    }

    /* BTO代替案リンク */
    .bto-alt-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span>⚡</span> RigPrice
      <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted); margin-left:6px;">自作PCパーツ＆ゲーミングBTO比較</span>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      各ショップ価格監視中 (Amazon / ドスパラ / パソコン工房 / ツクモ)
    </div>
  </div>
</header>

<div class="container">

  <!-- 高単価BTO完成品PCへの誘導バナー -->
  <div class="bto-hero">
    <div class="bto-hero-text">
      <h3>🖥️ 「パーツから組み立てるのは面倒…」という方へ</h3>
      <p>RTX 4070 / 4060搭載の即納ゲーミング完成品PC（保証・サポート付き）がセール中！</p>
    </div>
    <a href="#" target="_blank" class="bto-btn">
      ドスパラ・工房の即納PCをチェック →
    </a>
  </div>

  <!-- カテゴリタブ & 検索 & ソート -->
  <div class="controls">
    <div class="category-nav">
      <button class="cat-btn active" onclick="filterCategory('ALL')">すべて表示</button>
      <button class="cat-btn" onclick="filterCategory('SET')">💡 予算別おすすめ一式セット</button>
      <button class="cat-btn" onclick="filterCategory('GPU')">GPU (グラフィックボード)</button>
      <button class="cat-btn" onclick="filterCategory('CPU')">CPU (プロセッサ)</button>
      <button class="cat-btn" onclick="filterCategory('RAM')">メモリ (DDR5)</button>
      <button class="cat-btn" onclick="filterCategory('SSD')">M.2 SSD (Gen4)</button>
      <button class="cat-btn" onclick="filterCategory('PSU')">電源ユニット</button>
    </div>

    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="型番やパーツ名で検索 (例: 4070, 7800X3D, 15万円)..." oninput="renderParts()">
      </div>
      <select class="sort-select" id="sortSelect" onchange="renderParts()">
        <option value="popular">人気・定番順</option>
        <option value="price-asc">最安値が安い順</option>
        <option value="price-desc">最安値が高い順</option>
      </select>
    </div>
  </div>

  <!-- メイングリッド -->
  <div class="parts-grid" id="partsGrid"></div>

</div>

<script>
  const partsData = [
    // 一括セット（高額報酬狙い）
    {
      id: 'set-mid',
      category: 'SET',
      name: '【予算16万円】フルHD〜WQHD快適ゲーミング一式セット',
      spec: 'Ryzen 5 7600 + RTX 4060 + 32GB RAM + 1TB SSD + 650W電源',
      trend: 'パーツ個別購入で最安合計を算出',
      btoAltText: '同スペックの完成品PC（GALLERIA等）を見る',
      prices: [
        { shop: 'パソコン工房', code: 'koubou', price: 158800, shipping: 0, point: 1588, url: '#' },
        { shop: 'ドスパラ', code: 'dospara', price: 161200, shipping: 0, point: 1612, url: '#' },
        { shop: 'ツクモ', code: 'tsukumo', price: 162900, shipping: 0, point: 1629, url: '#' },
        { shop: 'Amazon.co.jp', code: 'amazon', price: 164500, shipping: 0, point: 1645, url: '#' }
      ]
    },
    {
      id: 'set-high',
      category: 'SET',
      name: '【予算25万円】WQHD高リフレッシュレート・配信最強セット',
      spec: 'Ryzen 7 7800X3D + RTX 4070 SUPER + 32GB RAM + 2TB SSD + 850W電源',
      trend: 'VALORANT 400fps / Apex 240fps固定可能',
      btoAltText: '同スペックの完成品PCを見る',
      prices: [
        { shop: 'パソコン工房', code: 'koubou', price: 248000, shipping: 0, point: 2480, url: '#' },
        { shop: 'ツクモ', code: 'tsukumo', price: 251000, shipping: 0, point: 2510, url: '#' },
        { shop: 'ドスパラ', code: 'dospara', price: 252800, shipping: 0, point: 2528, url: '#' },
        { shop: 'Amazon.co.jp', code: 'amazon', price: 256000, shipping: 0, point: 2560, url: '#' }
      ]
    },
    // 単品パーツ
    {
      id: 'gpu-4070s',
      category: 'GPU',
      name: 'GeForce RTX 4070 SUPER 12GB',
      spec: '1440p/WQHD最高設定向け / TDP 220W',
      trend: '直近比 -¥3,800',
      btoAltText: 'RTX 4070 Super搭載完成品PCを見る',
      prices: [
        { shop: 'パソコン工房', code: 'koubou', price: 92800, shipping: 0, point: 928, url: '#' },
        { shop: 'ドスパラ', code: 'dospara', price: 93500, shipping: 0, point: 935, url: '#' },
        { shop: 'Amazon.co.jp', code: 'amazon', price: 94800, shipping: 0, point: 948, url: '#' },
        { shop: 'ツクモ', code: 'tsukumo', price: 95980, shipping: 0, point: 960, url: '#' }
      ]
    },
    {
      id: 'cpu-7800x3d',
      category: 'CPU',
      name: 'AMD Ryzen 7 7800X3D (8C/16T)',
      spec: '3D V-Cache搭載 / ゲーミング最強CPU',
      trend: '品薄・価格上昇傾向',
      btoAltText: 'Ryzen 7 7800X3D搭載完成品PCを見る',
      prices: [
        { shop: 'ツクモ', code: 'tsukumo', price: 65800, shipping: 0, point: 658, url: '#' },
        { shop: 'Amazon.co.jp', code: 'amazon', price: 66980, shipping: 0, point: 670, url: '#' },
        { shop: 'パソコン工房', code: 'koubou', price: 67200, shipping: 0, point: 672, url: '#' },
        { shop: 'ドスパラ', code: 'dospara', price: 67500, shipping: 0, point: 675, url: '#' }
      ]
    },
    {
      id: 'gpu-4060',
      category: 'GPU',
      name: 'GeForce RTX 4060 8GB',
      spec: 'フルHDゲーミング鉄板 / 低消費電力 115W',
      trend: '価格安定中',
      btoAltText: 'RTX 4060搭載完成品PCを見る',
      prices: [
        { shop: 'Amazon.co.jp', code: 'amazon', price: 42980, shipping: 0, point: 430, url: '#' },
        { shop: 'ドスパラ', code: 'dospara', price: 43800, shipping: 0, point: 438, url: '#' },
        { shop: 'パソコン工房', code: 'koubou', price: 43900, shipping: 0, point: 439, url: '#' },
        { shop: 'ツクモ', code: 'tsukumo', price: 44200, shipping: 0, point: 442, url: '#' }
      ]
    },
    {
      id: 'ram-ddr5-32gb',
      category: 'RAM',
      name: 'DDR5-6000 32GB (16GB×2)',
      spec: 'Ryzen 7000/9000 & Core 14世代 最適化メモリ',
      trend: '直近比 -¥1,200',
      btoAltText: '',
      prices: [
        { shop: 'Amazon.co.jp', code: 'amazon', price: 14980, shipping: 0, point: 150, url: '#' },
        { shop: 'ツクモ', code: 'tsukumo', price: 15480, shipping: 0, point: 155, url: '#' },
        { shop: 'パソコン工房', code: 'koubou', price: 15800, shipping: 0, point: 158, url: '#' },
        { shop: 'ドスパラ', code: 'dospara', price: 15980, shipping: 0, point: 160, url: '#' }
      ]
    },
    {
      id: 'ssd-gen4-2tb',
      category: 'SSD',
      name: 'M.2 NVMe SSD 2TB (Gen4 7000MB/s級)',
      spec: '読込7,300MB/s / PS5増設対応',
      trend: '最安値更新',
      btoAltText: '',
      prices: [
        { shop: 'パソコン工房', code: 'koubou', price: 18980, shipping: 0, point: 190, url: '#' },
        { shop: 'Amazon.co.jp', code: 'amazon', price: 19480, shipping: 0, point: 195, url: '#' },
        { shop: 'ドスパラ', code: 'dospara', price: 19800, shipping: 0, point: 198, url: '#' },
        { shop: 'ツクモ', code: 'tsukumo', price: 20200, shipping: 0, point: 202, url: '#' }
      ]
    }
  ];

  let currentCategory = 'ALL';

  function filterCategory(cat) {
    currentCategory = cat;
    const btns = document.querySelectorAll('.cat-btn');
    btns.forEach(btn => {
      btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'ALL' && btn.textContent === 'すべて表示'));
    });
    renderParts();
  }

  function renderParts() {
    const grid = document.getElementById('partsGrid');
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const sort = document.getElementById('sortSelect').value;

    let list = partsData.filter(item => {
      const matchCat = (currentCategory === 'ALL' || item.category === currentCategory);
      const matchQuery = !query || item.name.toLowerCase().includes(query) || item.spec.toLowerCase().includes(query);
      return matchCat && matchQuery;
    });

    list.sort((a, b) => {
      const minA = Math.min(...a.prices.map(p => p.price));
      const minB = Math.min(...b.prices.map(p => p.price));
      if (sort === 'price-asc') return minA - minB;
      if (sort === 'price-desc') return minB - minA;
      return 0;
    });

    grid.innerHTML = '';

    list.forEach(item => {
      const sortedPrices = [...item.prices].sort((x, y) => x.price - y.price);
      const best = sortedPrices[0];

      let storeHtml = '';
      sortedPrices.forEach(p => {
        const isLowest = p.price === best.price;
        storeHtml += `
          <div class="store-item ${isLowest ? 'is-lowest' : ''}">
            <div class="store-name-group">
              <span class="store-pill pill-${p.code}">${p.shop}</span>
              ${isLowest ? '<span style="color:var(--success); font-size:0.7rem; font-weight:bold;">最安</span>' : ''}
            </div>
            <div style="text-align:right;">
              <span class="store-price">¥${p.price.toLocaleString()}</span>
              <span class="store-subinfo">(${p.point}pt還元)</span>
            </div>
          </div>
        `;
      });

      const card = document.createElement('div');
      card.className = 'part-card';
      card.innerHTML = `
        <div>
          <div class="card-top">
            <span class="tag">${item.category === 'SET' ? '一式セット' : item.category}</span>
            <span class="trend-down">📉 ${item.trend}</span>
          </div>
          <h2 class="part-name">${item.name}</h2>
          <div class="part-spec">${item.spec}</div>

          <div class="best-price-box">
            <div>
              <span class="best-label">現在最安値ショップ</span>
              <span class="best-store">${best.shop}</span>
            </div>
            <div class="best-price">¥${best.price.toLocaleString()}</div>
          </div>

          <div class="store-list">
            ${storeHtml}
          </div>
        </div>

        <div>
          <a href="${best.url}" target="_blank" class="btn-buy">
            ${best.shop} で最安値をチェック →
          </a>
          ${item.btoAltText ? `<a href="#" target="_blank" class="bto-alt-link">${item.btoAltText} →</a>` : ''}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  renderParts();
</script>

</body>
</html>
