<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RigPrice Used | 自作PC・フリマ相場比較 & リアルタイム最安ナビ</title>
  <meta name="description" content="中古PCパーツ（CPU、GPU、マザーボード、メモリ）のフリマ相場・最安値を一発比較。メルカリ、ヤフオク、楽天中古から賢くお得にパーツを探せます。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2e;
      --border: #232f48;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }
    header {
      padding: 3rem 1rem 2rem;
      text-align: center;
      background: linear-gradient(180deg, #10172a 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
      justify-content: center;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      background: #1e293b;
      color: #38bdf8;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #f8fafc;
    }
    .card-price-ref {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 0.25rem;
    }
    .price-box {
      background: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .price-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .price-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .diff-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      line-height: 1.5;
      flex-grow: 1;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .btn-group .btn-single {
      grid-column: span 2;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.65rem;
      border-radius: 8px;
      transition: opacity 0.2s;
      color: #ffffff;
      text-align: center;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-mercari {
      background: linear-gradient(135deg, #ff333f 0%, #e11d48 100%);
    }
    .btn-yahoo {
      background: #f97316;
    }
    .btn-rakuten {
      background: #bf0000;
    }
    .notice {
      margin-top: 3rem;
      padding: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <h1>RigPrice Used</h1>
    <p>中古PCパーツ・フリマ相場比較ナビ。メルカリ・ヤフオク・楽天の中古価格をまとめてチェック。</p>
  </header>

  <div class="container">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterCards('ALL', this)">すべて</button>
      <button class="filter-btn" onclick="filterCards('CPU-INTEL', this)">Intel CPU</button>
      <button class="filter-btn" onclick="filterCards('CPU-AMD', this)">AMD CPU</button>
      <button class="filter-btn" onclick="filterCards('GPU-NVIDIA', this)">NVIDIA GPU</button>
      <button class="filter-btn" onclick="filterCards('GPU-AMD', this)">AMD GPU</button>
      <button class="filter-btn" onclick="filterCards('MB', this)">マザーボード</button>
      <button class="filter-btn" onclick="filterCards('RAM', this)">メモリ</button>
    </div>

    <div class="cards-grid" id="partsGrid"></div>

    <div class="notice">
      <p>※表示されている中古相場価格は大手中古専門店・モールの直近の平均価格（自動巡回）です。在庫状況や商品の状態によって実際の出品価格とは異なる場合があります。</p>
      <p>※当サイトの各リンクはメルカリアンバサダーおよび各モールのアフィリエイトプログラムを利用しています。</p>
    </div>
  </div>

  <script>
    let allParts = [];

    // ==========================================
    // アフィリエイトID設定
    // ==========================================
    const MERCARI_AFFILIATE_ID = "3331168449";
    const RAKUTEN_AFFILIATE_ID = "5091a1e4.767a4d53.5091a1e5.9fa5c735";
    
    // バリューコマース（ヤフオク提携時の sid と pid を入力。空欄なら通常ヤフオク中古URL）
    const VC_SID = "";
    const VC_PID = "";

    async function loadParts() {
      try {
        const res = await fetch('parts.json?t=' + Date.now());
        allParts = await res.json();
        renderCards(allParts);
      } catch (err) {
        document.getElementById('partsGrid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">データ読み込み中...</p>';
      }
    }

    function renderCards(parts) {
      const grid = document.getElementById('partsGrid');
      grid.innerHTML = parts.map(p => {
        // 1. メルカリ（アンバサダー直結・購入額の2%報酬）
        const mercariWord = encodeURIComponent(p.mercariQuery || p.name);
        const mercariUrl = `https://jp.mercari.com/search?keyword=${mercariWord}&afid=${MERCARI_AFFILIATE_ID}`;

        // 2. ヤフオク（istatus=2で中古確定 ＋ バリューコマース経由）
        const yahooWord = encodeURIComponent(p.yahooQuery || p.name);
        const rawYahooUrl = `https://auctions.yahoo.co.jp/search/search?p=${yahooWord}&istatus=2`;
        let yahooFinalUrl = rawYahooUrl;
        if (VC_SID && VC_PID) {
          yahooFinalUrl = `https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=${VC_SID}&pid=${VC_PID}&vc_url=${encodeURIComponent(rawYahooUrl)}`;
        }

        // 3. 楽天中古（公式アフィリエイト直結・二重エンコードで転送崩れを防ぎ報酬100%計上）
        const rakutenKeyword = (p.shopQuery || p.name) + " 中古";
        const doubleEncodedKeyword = encodeURIComponent(encodeURIComponent(rakutenKeyword));
        const rakutenUrl = `https://hb.afl.rakuten.co.jp/hgc/${RAKUTEN_AFFILIATE_ID}/?pc=https%3A%2F%2Fsearch.rakuten.co.jp%2Fsearch%2Fmall%2F${doubleEncodedKeyword}%2F`;

        return `
          <div class="card" data-category="${p.category}">
            <div class="card-header">
              <span class="badge">${p.badge}</span>
              <span class="diff-badge">${p.diffPercent || 'お得'}</span>
            </div>
            <div class="card-title">${p.name}</div>
            <div class="card-price-ref">${p.newPriceRef}</div>
            <div class="price-box">
              <span class="price-label">中古相場目安</span>
              <span class="price-val">¥${Number(p.usedPriceAvg).toLocaleString()}</span>
            </div>
            <div class="card-desc">${p.recommend}</div>
            <div class="btn-group">
              <a href="${mercariUrl}" target="_blank" rel="noopener" class="btn btn-mercari btn-single">メルカリで探す</a>
              <a href="${yahooFinalUrl}" target="_blank" rel="noopener" class="btn btn-yahoo">ヤフオク中古</a>
              <a href="${rakutenUrl}" target="_blank" rel="noopener" class="btn btn-rakuten">楽天中古</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCards(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (category === 'ALL') {
        renderCards(allParts);
      } else {
        const filtered = allParts.filter(p => p.category === category);
        renderCards(filtered);
      }
    }

    loadParts();
  </script>
</body>
</html>
