<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RigPrice Used - 中古PCパーツ相場＆フリマ最安値チェッカー</title>
  <style>
    :root {
      --bg-main: #0a0f1d;
      --bg-card: #131c31;
      --bg-sub: #1b2744;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #243456;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }
    header {
      background: rgba(19, 28, 49, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .logo span { color: var(--warning); }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      background: var(--bg-sub);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 20px 60px 20px;
    }

    .used-hero {
      background: linear-gradient(135deg, #1c1917, #292524);
      border: 1px solid #78716c;
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .used-hero h3 {
      margin: 0 0 6px 0;
      color: #fde047;
      font-size: 1.1rem;
    }
    .used-hero p {
      margin: 0;
      font-size: 0.85rem;
      color: #d6d3d1;
    }
    .hero-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .hero-tag {
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      color: #fafaf9;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .category-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-btn:hover {
      border-color: var(--accent);
      color: #fff;
    }
    .cat-btn.active {
      background: var(--warning);
      color: #000;
      border-color: var(--warning);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
    }
    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 260px;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .sort-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 20px;
    }
    .part-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .part-card:hover {
      transform: translateY(-3px);
      border-color: var(--warning);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-sub);
      color: var(--warning);
      border: 1px solid var(--border);
    }
    .part-name {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0 0 4px 0;
      color: #fff;
    }
    .new-reference {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .new-reference s { color: #94a3b8; }

    .recommend-box {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 0.8rem;
      color: #e0f2fe;
      line-height: 1.45;
    }
    .recommend-title {
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .used-price-box {
      background: var(--bg-sub);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-left: 4px solid var(--warning);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .used-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .used-sub {
      font-size: 0.75rem;
      color: var(--success);
      font-weight: bold;
      display: block;
    }
    .used-price {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--warning);
      letter-spacing: -0.5px;
    }

    .market-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .market-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      transition: opacity 0.2s;
    }
    .market-btn:hover { opacity: 0.88; }
    .btn-mercari {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }
    .btn-yahoo {
      background: linear-gradient(135deg, #ff0033, #d9002c);
    }
    .btn-shop {
      background: var(--bg-sub);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-shop:hover { border-color: var(--accent); }
    .market-pill {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span>♻️</span> RigPrice Used
      <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted); margin-left:6px;">自作PCパーツ 中古・フリマ相場チェッカー</span>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      自動相場監視システム稼働中
    </div>
  </div>
</header>

<div class="container">

  <div class="used-hero">
    <div>
      <h3>💡 「新品は高すぎる」人のための中古パーツ相場ガイド</h3>
      <p>型落ち・前世代の人気パーツは中古なら30〜60%OFF！最新の市場価格を自動集計して表示しています。</p>
      <div class="hero-tags">
        <span class="hero-tag">🎯 メルカリ: 個人出品最安</span>
        <span class="hero-tag">🔴 Yahoo!中古: PayPay還元＆専門店</span>
        <span class="hero-tag">🛡️ 楽天中古: じゃんぱら・工房・ソフマップ保証</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="category-nav">
      <button class="cat-btn active" onclick="filterCategory('ALL')">すべて表示</button>
      <button class="cat-btn" onclick="filterCategory('GPU')">GPU (グラボ)</button>
      <button class="cat-btn" onclick="filterCategory('CPU')">CPU</button>
      <button class="cat-btn" onclick="filterCategory('MB')">マザーボード</button>
      <button class="cat-btn" onclick="filterCategory('RAM')">メモリ</button>
    </div>

    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="型番や用途で検索 (例: 2070, 3060, B550, VALORANT)..." oninput="renderParts()">
      </div>
      <select class="sort-select" id="sortSelect" onchange="renderParts()">
        <option value="popular">人気順</option>
        <option value="price-asc">中古相場が安い順</option>
        <option value="price-desc">中古相場が高い順</option>
      </select>
    </div>
  </div>

  <div class="parts-grid" id="partsGrid"></div>

</div>

<script>
  // 3大モール アフィリエイト設定（完全連携済み）
  const MERCARI_AFID = '0587120265';
  const RAKUTEN_AFID = '57ef0d8f.f3c52344.57ef0d90.d175d532';
  const VC_YAHOO_SID = '3782755';
  const VC_YAHOO_PID = '892714269';

  let usedParts = [];
  let currentCategory = 'ALL';

  // parts.json を自動取得
  async function loadPartsData() {
    try {
      const res = await fetch('parts.json?v=' + Date.now());
      usedParts = await res.json();
      renderParts();
    } catch (e) {
      console.error('パーツデータの読み込みに失敗しました', e);
    }
  }

  function filterCategory(cat) {
    currentCategory = cat;
    const btns = document.querySelectorAll('.cat-btn');
    btns.forEach(btn => {
      btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'ALL' && btn.textContent === 'すべて表示'));
    });
    renderParts();
  }

  function renderParts() {
    const grid = document.getElementById('partsGrid');
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const sort = document.getElementById('sortSelect').value;

    let list = usedParts.filter(item => {
      const matchCat = (currentCategory === 'ALL' || item.category === currentCategory);
      const matchQuery = !query || item.name.toLowerCase().includes(query) || (item.recommend && item.recommend.toLowerCase().includes(query));
      return matchCat && matchQuery;
    });

    list.sort((a, b) => {
      if (sort === 'price-asc') return a.usedPriceAvg - b.usedPriceAvg;
      if (sort === 'price-desc') return b.usedPriceAvg - a.usedPriceAvg;
      return 0;
    });

    grid.innerHTML = '';

    list.forEach(item => {
      // 1. メルカリ
      const mercariUrl = `https://jp.mercari.com/search?afid=${MERCARI_AFID}&keyword=${item.mercariQuery}&status=on_sale`;
      
      // 2. Yahoo!ショッピング中古
      const yahooSearchRaw = `https://shopping.yahoo.co.jp/search?p=${item.yahooQuery}&used=1`;
      const yahooShopUrl = `https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=${VC_YAHOO_SID}&pid=${VC_YAHOO_PID}&vc_url=${encodeURIComponent(yahooSearchRaw)}`;
      
      // 3. 楽天中古・じゃんぱら等
      const rakutenSearchRaw = `https://search.rakuten.co.jp/search/mall/${item.shopQuery}+中古/?f=1`;
      const rakutenShopUrl = `https://hb.afl.rakuten.co.jp/ichiba/${RAKUTEN_AFID}/?pc=${encodeURIComponent(rakutenSearchRaw)}`;

      const card = document.createElement('div');
      card.className = 'part-card';
      card.innerHTML = `
        <div>
          <div class="card-top">
            <span class="tag">${item.category}</span>
          </div>
          <h2 class="part-name">${item.name}</h2>
          <div class="new-reference">参考: <s>${item.newPriceRef}</s></div>

          <div class="recommend-box">
            <div class="recommend-title">💡 こんな人におすすめ</div>
            <div>${item.recommend}</div>
          </div>

          <div class="used-price-box">
            <div>
              <span class="used-label">中古相場目安</span>
              <span class="used-sub">新品比 ${item.diffPercent}</span>
            </div>
            <div class="used-price">¥${item.usedPriceAvg.toLocaleString()}〜</div>
          </div>

          <div class="market-links">
            <a href="${mercariUrl}" target="_blank" class="market-btn btn-mercari">
              <span>メルカリで現在出品を見る</span>
              <span class="market-pill">即購入 (2%還元)</span>
            </a>
            <a href="${yahooShopUrl}" target="_blank" class="market-btn btn-yahoo">
              <span>Yahoo!ショッピング中古を探す</span>
              <span class="market-pill">PayPay還元・中古</span>
            </a>
            <a href="${rakutenShopUrl}" target="_blank" class="market-btn btn-shop">
              <span>${item.shopName}（保証付き）</span>
              <span class="market-pill">楽天・店舗保証 (2〜4%還元)</span>
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  loadPartsData();
</script>

</body>
</html>
