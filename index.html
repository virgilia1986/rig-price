  let usedParts = [...defaultParts];
  let currentCategory = 'ALL';

  async function loadPartsData() {
    try {
      const res = await fetch('parts.json?v=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          usedParts = data;
          renderParts();
        }
      }
    } catch (e) {
      console.log('Using default parts list');
    }
  }

  function filterCategory(cat) {
    currentCategory = cat;
    const btns = document.querySelectorAll('.cat-btn');
    btns.forEach(btn => {
      if (cat === 'ALL') {
        btn.classList.toggle('active', btn.textContent === 'すべて表示');
      } else {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(cat));
      }
    });
    renderParts();
  }

  function renderParts() {
    const grid = document.getElementById('partsGrid');
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const sort = document.getElementById('sortSelect').value;

    let list = usedParts.filter(item => {
      const matchCat = (currentCategory === 'ALL' || item.category === currentCategory);
      const matchQuery = !query || item.name.toLowerCase().includes(query) || (item.recommend && item.recommend.toLowerCase().includes(query));
      return matchCat && matchQuery;
    });

    list.sort((a, b) => {
      if (sort === 'price-asc') return a.usedPriceAvg - b.usedPriceAvg;
      if (sort === 'price-desc') return b.usedPriceAvg - a.usedPriceAvg;
      return 0;
    });

    grid.innerHTML = '';

    list.forEach(item => {
      // 1. メルカリ
      const mercariKeyword = encodeURIComponent(item.mercariQuery);
      const mercariUrl = `https://jp.mercari.com/search?afid=${MERCARI_AFID}&keyword=${mercariKeyword}&status=on_sale`;
      
      // 2. Yahoo!ショッピング中古（バリューコマース公式形式・二重エンコード防止）
      const yahooRawTarget = 'https://shopping.yahoo.co.jp/search?p=' + encodeURIComponent(item.yahooQuery) + '&used=1';
      const yahooShopUrl = 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=' + VC_YAHOO_SID + '&pid=' + VC_YAHOO_PID + '&vc_url=' + encodeURIComponent(yahooRawTarget);
      
      // 3. 楽天中古・じゃんぱら等
      const rakutenSearchRaw = `https://search.rakuten.co.jp/search/mall/${encodeURIComponent(item.shopQuery)}+中古/?f=1`;
      const rakutenShopUrl = `https://hb.afl.rakuten.co.jp/ichiba/${RAKUTEN_AFID}/?pc=${encodeURIComponent(rakutenSearchRaw)}`;

      const card = document.createElement('div');
      card.className = 'part-card';
      card.innerHTML = `
        <div>
          <div class="card-top">
            <span class="tag">${item.badge || item.category}</span>
          </div>
          <h2 class="part-name">${item.name}</h2>
          <div class="new-reference">参考: <s>${item.newPriceRef}</s></div>

          <div class="recommend-box">
            <div class="recommend-title">💡 こんな人におすすめ</div>
            <div>${item.recommend}</div>
          </div>

          <div class="used-price-box">
            <div>
              <span class="used-label">中古相場目安</span>
              <span class="used-sub">新品比 ${item.diffPercent}</span>
            </div>
            <div class="used-price">¥${item.usedPriceAvg.toLocaleString()}〜</div>
          </div>

          <div class="market-links">
            <a href="${mercariUrl}" target="_blank" rel="noopener noreferrer" class="market-btn btn-mercari">
              <span>メルカリで現在出品を見る</span>
              <span class="market-pill">即購入 (2%還元)</span>
            </a>
            <a href="${yahooShopUrl}" target="_blank" rel="nofollow" class="market-btn btn-yahoo">
              <span>Yahoo!ショッピング中古を探す</span>
              <span class="market-pill">PayPay還元・中古</span>
            </a>
            <a href="${rakutenShopUrl}" target="_blank" rel="noopener noreferrer" class="market-btn btn-shop">
              <span>${item.shopName}（保証付き）</span>
              <span class="market-pill">楽天・店舗保証 (2〜4%還元)</span>
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  renderParts();
  loadPartsData();
</script>
