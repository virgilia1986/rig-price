<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RigPrice Used - 中古PCパーツ相場＆フリマ最安値チェッカー</title>
  <style>
    :root {
      --bg-main: #0a0f1d;
      --bg-card: #131c31;
      --bg-sub: #1b2744;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #243456;
      --shop-mercari: #ea352d;
      --shop-yahoo: #ff0033;
      --shop-janpara: #005bac;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }
    header {
      background: rgba(19, 28, 49, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .logo span { color: var(--warning); }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      background: var(--bg-sub);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 20px 60px 20px;
    }

    .used-hero {
      background: linear-gradient(135deg, #1c1917, #292524);
      border: 1px solid #78716c;
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .used-hero h3 {
      margin: 0 0 6px 0;
      color: #fde047;
      font-size: 1.1rem;
    }
    .used-hero p {
      margin: 0;
      font-size: 0.85rem;
      color: #d6d3d1;
    }
    .hero-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .hero-tag {
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      color: #fafaf9;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .category-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-btn:hover {
      border-color: var(--accent);
      color: #fff;
    }
    .cat-btn.active {
      background: var(--warning);
      color: #000;
      border-color: var(--warning);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
    }
    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 260px;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .sort-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 20px;
    }
    .part-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .part-card:hover {
      transform: translateY(-3px);
      border-color: var(--warning);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-sub);
      color: var(--warning);
      border: 1px solid var(--border);
    }
    .part-name {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0 0 4px 0;
      color: #fff;
    }
    .new-reference {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .new-reference s { color: #94a3b8; }

    .used-price-box {
      background: var(--bg-sub);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-left: 4px solid var(--warning);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .used-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .used-sub {
      font-size: 0.75rem;
      color: var(--success);
      font-weight: bold;
      display: block;
    }
    .used-price {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--warning);
      letter-spacing: -0.5px;
    }

    .market-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .market-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      transition: opacity 0.2s;
    }
    .market-btn:hover { opacity: 0.88; }
    .btn-mercari {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }
    .btn-yahoo {
      background: linear-gradient(135deg, #f97316, #ea580c);
    }
    .btn-shop {
      background: var(--bg-sub);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-shop:hover { border-color: var(--accent); }
    .market-pill {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span>♻️</span> RigPrice Used
      <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted); margin-left:6px;">自作PCパーツ 中古・フリマ相場チェッカー</span>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      メルカリ / ヤフオク / じゃんぱら 相場監視
    </div>
  </div>
</header>

<div class="container">

  <div class="used-hero">
    <div>
      <h3>💡 「新品は高すぎる」人のための中古パーツ相場ガイド</h3>
      <p>型落ち・前世代の人気パーツは中古なら30〜50%OFF！各モールの実売・出品相場をチェックできます。</p>
      <div class="hero-tags">
        <span class="hero-tag">🎯 メルカリ: 個人出品最安</span>
        <span class="hero-tag">🔨 ヤフオク: 競り・掘り出し物</span>
        <span class="hero-tag">🛡️ じゃんぱら・店舗中古: 保証付き</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="category-nav">
      <button class="cat-btn active" onclick="filterCategory('ALL')">すべて表示</button>
      <button class="cat-btn" onclick="filterCategory('GPU')">GPU (グラボ)</button>
      <button class="cat-btn" onclick="filterCategory('CPU')">CPU</button>
      <button class="cat-btn" onclick="filterCategory('RAM')">メモリ</button>
      <button class="cat-btn" onclick="filterCategory('MB')">マザーボード</button>
    </div>

    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="型番で検索 (例: 3080, 3070, 5700X, 12400F)..." oninput="renderParts()">
      </div>
      <select class="sort-select" id="sortSelect" onchange="renderParts()">
        <option value="popular">人気順</option>
        <option value="price-asc">中古相場が安い順</option>
        <option value="price-desc">中古相場が高い順</option>
      </select>
    </div>
  </div>

  <div class="parts-grid" id="partsGrid"></div>

</div>

<script>
  // あなた専用のメルカリアンバサダーID
  const MERCARI_AFID = '0587120265';

  const usedParts = [
    {
      id: 'rtx-3080',
      category: 'GPU',
      name: 'GeForce RTX 3080 10GB',
      newPriceRef: '新品当時: 約¥100,000〜',
      usedPriceAvg: 54000,
      diffPercent: '約46% OFF',
      mercariQuery: 'RTX+3080',
      yahooQuery: 'RTX+3080',
      shopName: 'じゃんぱら / ソフマップ',
      shopQuery: 'RTX+3080'
    },
    {
      id: 'rtx-3070',
      category: 'GPU',
      name: 'GeForce RTX 3070 8GB',
      newPriceRef: '新品当時: 約¥75,000〜',
      usedPriceAvg: 38000,
      diffPercent: '約49% OFF',
      mercariQuery: 'RTX+3070',
      yahooQuery: 'RTX+3070',
      shopName: 'じゃんぱら / ソフマップ',
      shopQuery: 'RTX+3070'
    },
    {
      id: 'rtx-3060ti',
      category: 'GPU',
      name: 'GeForce RTX 3060 Ti 8GB',
      newPriceRef: '新品当時: 約¥60,000〜',
      usedPriceAvg: 31000,
      diffPercent: '約48% OFF',
      mercariQuery: 'RTX+3060Ti',
      yahooQuery: 'RTX+3060Ti',
      shopName: 'じゃんぱら / イオシス',
      shopQuery: 'RTX+3060Ti'
    },
    {
      id: 'rtx-4060',
      category: 'GPU',
      name: 'GeForce RTX 4060 8GB',
      newPriceRef: '新品最安: 約¥43,000',
      usedPriceAvg: 36000,
      diffPercent: '約16% OFF',
      mercariQuery: 'RTX+4060',
      yahooQuery: 'RTX+4060',
      shopName: '工房中古 / じゃんぱら',
      shopQuery: 'RTX+4060'
    },
    {
      id: 'ryzen-5700x',
      category: 'CPU',
      name: 'AMD Ryzen 7 5700X (8C/16T)',
      newPriceRef: '新品最安: 約¥23,000',
      usedPriceAvg: 16500,
      diffPercent: '約28% OFF',
      mercariQuery: 'Ryzen+7+5700X',
      yahooQuery: 'Ryzen+7+5700X',
      shopName: 'じゃんぱら / ソフマップ',
      shopQuery: 'Ryzen+7+5700X'
    },
    {
      id: 'core-i5-12400f',
      category: 'CPU',
      name: 'Intel Core i5-12400F',
      newPriceRef: '新品最安: 約¥19,000',
      usedPriceAvg: 12800,
      diffPercent: '約32% OFF',
      mercariQuery: 'i5+12400F',
      yahooQuery: 'i5+12400F',
      shopName: 'じゃんぱら / 工房中古',
      shopQuery: 'i5+12400F'
    },
    {
      id: 'ryzen-7800x3d',
      category: 'CPU',
      name: 'AMD Ryzen 7 7800X3D',
      newPriceRef: '新品最安: 約¥66,000',
      usedPriceAvg: 54000,
      diffPercent: '約18% OFF',
      mercariQuery: 'Ryzen+7+7800X3D',
      yahooQuery: 'Ryzen+7+7800X3D',
      shopName: 'じゃんぱら / ソフマップ',
      shopQuery: 'Ryzen+7+7800X3D'
    },
    {
      id: 'b550-board',
      category: 'MB',
      name: 'AMD B550チップセット ATX/MicroATX',
      newPriceRef: '新品相場: 約¥14,000',
      usedPriceAvg: 8500,
      diffPercent: '約39% OFF',
      mercariQuery: 'B550+マザーボード',
      yahooQuery: 'B550+マザーボード',
      shopName: 'じゃんぱら / 工房中古',
      shopQuery: 'B550+マザーボード'
    },
    {
      id: 'ddr4-32gb',
      category: 'RAM',
      name: 'DDR4-3200 32GB (16GB×2)',
      newPriceRef: '新品最安: 約¥9,000',
      usedPriceAvg: 5800,
      diffPercent: '約35% OFF',
      mercariQuery: 'DDR4+32GB+16GB2枚',
      yahooQuery: 'DDR4+32GB',
      shopName: 'じゃんぱら / ソフマップ',
      shopQuery: 'DDR4+32GB'
    }
  ];

  let currentCategory = 'ALL';

  function filterCategory(cat) {
    currentCategory = cat;
    const btns = document.querySelectorAll('.cat-btn');
    btns.forEach(btn => {
      btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'ALL' && btn.textContent === 'すべて表示'));
    });
    renderParts();
  }

  function renderParts() {
    const grid = document.getElementById('partsGrid');
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const sort = document.getElementById('sortSelect').value;

    let list = usedParts.filter(item => {
      const matchCat = (currentCategory === 'ALL' || item.category === currentCategory);
      const matchQuery = !query || item.name.toLowerCase().includes(query);
      return matchCat && matchQuery;
    });

    list.sort((a, b) => {
      if (sort === 'price-asc') return a.usedPriceAvg - b.usedPriceAvg;
      if (sort === 'price-desc') return b.usedPriceAvg - a.usedPriceAvg;
      return 0;
    });

    grid.innerHTML = '';

    list.forEach(item => {
      // あなたのアンバサダーID付きURL
      const mercariUrl = `https://jp.mercari.com/search?afid=${MERCARI_AFID}&keyword=${item.mercariQuery}&status=on_sale`;
      const yahooUrl = `https://auctions.yahoo.co.jp/search/search?p=${item.yahooQuery}&va=${item.yahooQuery}&exflg=1&b=1&n=50`;
      const rakutenShopUrl = `https://search.rakuten.co.jp/search/mall/${item.shopQuery}+中古/?f=1`;

      const card = document.createElement('div');
      card.className = 'part-card';
      card.innerHTML = `
        <div>
          <div class="card-top">
            <span class="tag">${item.category}</span>
          </div>
          <h2 class="part-name">${item.name}</h2>
          <div class="new-reference">参考: <s>${item.newPriceRef}</s></div>

          <div class="used-price-box">
            <div>
              <span class="used-label">中古相場目安</span>
              <span class="used-sub">新品比 ${item.diffPercent}</span>
            </div>
            <div class="used-price">¥${item.usedPriceAvg.toLocaleString()}〜</div>
          </div>

          <div class="market-links">
            <a href="${mercariUrl}" target="_blank" class="market-btn btn-mercari">
              <span>メルカリで現在出品を見る</span>
              <span class="market-pill">即購入 (2%還元対象)</span>
            </a>
            <a href="${yahooUrl}" target="_blank" class="market-btn btn-yahoo">
              <span>ヤフオクで最安落札を狙う</span>
              <span class="market-pill">オークション</span>
            </a>
            <a href="${rakutenShopUrl}" target="_blank" class="market-btn btn-shop">
              <span>${item.shopName}（保証付き）</span>
              <span class="market-pill">店舗保証</span>
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  renderParts();
</script>

</body>
</html>
